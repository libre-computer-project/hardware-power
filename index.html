<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Scripts from this site only, plus the inline theme snippet by its sha256
     (tools/check-kit.py recomputes it); data, styles and images same-origin,
     data: for the kit's logo. GitHub Pages sets no headers, so it is a meta. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-ACy4pj93O7g7s8NBZ36xdNPdeBUZ5qKl4pgUR78Pd7E='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libre Computer Board Power</title>
<meta name="description" content="Power tree for Libre Computer boards: which regulator feeds which rail, what switches it, and which rails are on in each power state, from each board's own netlist.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/lc-kit.css">
<link rel="stylesheet" href="css/style.css">
<!-- Sets the theme before first paint, so a dark visitor never sees a white
     flash. Must stay inline and must stay ahead of the stylesheets; the copy
     is checked by tools/lc-ui-kit/sync.py against HEAD_SNIPPET in lc-kit.js. -->
<script>try{var p=localStorage.getItem("theme")||"auto";if(p==="dark"||(p==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch(e){}</script>
</head>
<body>

<header class="lc-topbar">
  <div class="lc-brand">
    <a class="lc-brand-name" href="https://libre.computer">Libre Computer</a>
    <nav class="lc-sites" aria-label="Libre Computer sites">
      <a class="lc-site" href="https://education.libre.computer/">Education</a>
      <a class="lc-site" data-lc-site href="https://layout.hardware.libre.computer/">Layout</a>
      <a class="lc-site" data-lc-site href="https://gpio.hardware.libre.computer/">GPIO Pinout</a>
      <a class="lc-site" href="/" aria-current="true">Power</a>
      <a class="lc-site" href="https://memory.software.libre.computer/">Memory</a>
    </nav>
  </div>
  <div class="lc-controls">
    <label for="board-select">Board</label>
    <select id="board-select" aria-label="Select board"></select>
    <input id="search" type="search" placeholder="Find a rail or part" autocomplete="off" spellcheck="false" aria-label="Find a rail, part or SoC pad">
  </div>
</header>

<h1 class="pw-sr">Libre Computer board power</h1>
<p class="pw-sr" id="announce" role="status" aria-live="polite"></p>
<div class="lc-notices" id="notices"></div>
<script src="js/file-notice.js"></script>

<div class="lc-main">
  <aside class="lc-panel" id="sidebar">
    <h3>Board</h3>
    <div id="board-meta"></div>

    <h3 id="state-heading">Power state</h3>
    <div id="walk"></div>
    <div id="legend" class="pw-legend" role="group" aria-label="Legend"></div>

    <h3 id="view-heading">View</h3>
    <div class="lc-seg" id="view-seg" role="group" aria-label="View">
      <button type="button" id="view-tree" aria-pressed="true">Tree</button>
      <button type="button" id="view-rails" aria-pressed="false">Rails</button>
    </div>
  </aside>

  <main id="stage">
    <div id="tree" class="pw-tree"></div>
    <div id="rails" hidden></div>
  </main>

  <aside class="lc-panel pw-detail" id="detail" aria-label="Rail details" hidden></aside>
</div>

<footer class="lc-footer">
  What feeds what, and what is on when, from each board's own netlist ·
  Learn how it works: <a href="https://education.libre.computer/modules/power/">first power-on and voltage rails</a> ·
  <a href="https://libre.computer">libre.computer</a>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
