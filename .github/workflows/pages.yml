name: Publish

# The site is static, so the deploy is a copy. CI refuses a bad commit.
# Regenerating graphs is not done here: that reads the private layout checkout,
# which this runner does not have. test-graph.py stays off this workflow.
# test-classify.py and check-site.py judge the committed JSON only.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the published tree
        run: python3 tools/check-site.py
      - name: Verify the vendored shell kit
        run: python3 tools/check-kit.py
      - name: Classifier fixture
        run: python3 tools/test-classify.py

  deploy:
    needs: check
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
